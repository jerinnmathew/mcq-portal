<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEA-1 MCQ Battle Platform</title>
    <meta name="description" content="A competitive local full-stack multiple-choice question arena to sharpen your technical skills and maintain practice streaks.">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            blue: 'var(--primary-blue)',
                            purple: 'var(--primary-purple)',
                            dark: 'var(--primary-dark)',
                        },
                        accent: {
                            cyan: 'var(--accent-cyan)',
                            green: 'var(--accent-green)',
                            orange: 'var(--accent-orange)',
                            red: 'var(--accent-red)',
                        },
                        gray: {
                            50: 'var(--gray-50)',
                            100: 'var(--gray-100)',
                            200: 'var(--gray-200)',
                            300: 'var(--gray-300)',
                            400: 'var(--gray-400)',
                            500: 'var(--gray-500)',
                            600: 'var(--gray-600)',
                            700: 'var(--gray-700)',
                            800: 'var(--gray-800)',
                            900: 'var(--gray-900)',
                        },
                        darkblue: {
                            900: 'var(--bg-secondary)',
                            800: 'var(--bg-primary)',
                            700: 'var(--border-color)',
                        }
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
                        display: ['"Barlow Condensed"', '"Barlow"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Custom stylesheet overrides -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#222022] text-slate-100 min-h-screen bg-mesh flex flex-col">

    <!-- Header Navbar Container -->
    <header id="navbar-container" class="glass-panel sticky top-0 z-50 border-b border-white/5"></header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col justify-center max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-20 overflow-x-hidden w-full">
        
        <!-- Hero Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
            
            <div class="space-y-6 text-left animate-fade-in">
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight">
                    <span class="text-gradient-shine font-display">Dominate the MCQ Battle</span>
                </h1>
                
                <p class="text-lg text-slate-400 max-w-lg">
                    Sign in with your padikkunnundo.app account to solve curated MCQ challenges, build your streak, and earn XP.
                </p>
                
                <div class="flex flex-wrap gap-4 pt-2">
                    <a href="/dashboard" id="btn-hero-start-quiz" class="px-6 py-3.5 rounded-xl font-extrabold bg-[#C3D809] hover:bg-[#d4eb1a] text-[#111111] shadow-lg shadow-[#C3D809]/20 hover:shadow-[#C3D809]/30 transform hover:-translate-y-0.5 transition-all text-center flex items-center justify-center gap-2">
                        <i class="fas fa-play text-xs"></i> Start Quiz
                    </a>
                </div>

                <!-- Stats Snippet -->
                <div class="grid grid-cols-3 gap-6 pt-8 border-t border-white/5">
                    <div>
                        <div class="text-2xl font-bold text-slate-100" id="stat-categories">0+</div>
                        <div class="text-xs text-slate-400">Core Categories</div>
                    </div>
                    <div>
                        <div class="text-2xl font-bold text-slate-100">Instant</div>
                        <div class="text-xs text-slate-400">Accuracy Stats</div>
                    </div>
                    <div>
                        <div class="text-2xl font-bold text-slate-100">Streak</div>
                        <div class="text-xs text-slate-400">Streak Incentives</div>
                    </div>
                </div>
            </div>

            <!-- Visual Feature Board -->
            <div class="relative flex justify-center lg:justify-end animate-fade-in" style="animation-delay: 0.1s">
                
                <!-- Background ambient lights -->
                <div class="absolute -top-10 -left-10 h-72 w-72 bg-blue-500/10 rounded-full blur-3xl"></div>
                <div class="absolute -bottom-10 -right-10 h-72 w-72 bg-indigo-500/10 rounded-full blur-3xl"></div>

                <div id="battle-arena-card" class="w-full max-w-md relative z-10">
                    <!-- Home Image & Start Quiz Card -->
                    <div class="w-full overflow-hidden rounded-2xl bg-[#2d2b2d] border border-white/5 shadow-md flex flex-col">
                        <!-- Image Container -->
                        <div class="w-full overflow-hidden rounded-t-2xl bg-[#222022]">
                            <img src="assets/exam_meme.png" alt="Exam Meme" class="w-full h-auto object-cover">
                        </div>

                        <!-- Card Action Container -->
                        <div class="grid grid-cols-1 gap-3 p-5 bg-[#2d2b2d] border-t border-white/5">
                            <a href="/dashboard" class="py-3 rounded-xl font-extrabold bg-[#C3D809] hover:bg-[#d4eb1a] text-[#111111] shadow-lg shadow-[#C3D809]/20 font-bold transition-all text-center text-sm cursor-pointer flex items-center justify-center gap-2 uppercase tracking-wider">
                                <i class="fas fa-play text-xs"></i> Start Quiz
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="glass-panel border-t border-white/5 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-center gap-4">
            <span class="footer-copyright text-sm text-white">&copy; 2026 MCQ Battle Platform.</span>
        </div>
    </footer>

    <!-- App JS module -->
    <script src="app.js"></script>
    <script>
        // ── SSO Token Auto-Detection ──
        // When padikkunnundo.app redirects the user back to our portal with a JWT token,
        // automatically forward it to the backend SSO endpoint for verification & login.
        (function handleSSORedirect() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (token) {
                // Clean the URL to remove the token from the address bar
                history.replaceState(null, '', window.location.pathname);

                // Forward the token to the backend SSO endpoint.
                // The backend will verify it, create/update the user,
                // set session cookies, and redirect to dashboard.
                window.location.href = '/sso/login?token=' + encodeURIComponent(token) + '&next=/';
            }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            // Animate stats values
            setTimeout(() => {
                animateValue('stat-categories', 0, 10, 1200, "+");
            }, 300); // Small delay for visual entry
        });
    </script>
</body>
</html>
