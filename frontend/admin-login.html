<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SEA-1 MCQ Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#222022] text-slate-100 min-h-screen bg-mesh flex items-center justify-center px-4">
    <main class="w-full max-w-md glass-panel rounded-2xl border border-white/5 p-8 shadow-2xl">
        <div class="text-center mb-8">
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-[#C3D809] mb-3">Restricted Area</p>
            <h1 class="text-3xl font-extrabold font-display text-white">Admin <span class="text-[#C3D809]">Control Panel</span></h1>
            <p class="text-sm text-slate-400 mt-3">Sign in with the configured administrator account to manage questions.</p>
        </div>

        <form id="admin-login-form" class="space-y-5">
            <div>
                <label for="admin-username" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                <input id="admin-username" name="username" type="text" autocomplete="username" required class="w-full px-4 py-3 rounded-xl glass-input" />
            </div>
            <div>
                <label for="admin-password" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <input id="admin-password" name="password" type="password" autocomplete="current-password" required class="w-full px-4 py-3 rounded-xl glass-input" />
            </div>
            <p id="admin-login-error" class="hidden text-sm text-red-400" role="alert"></p>
            <button type="submit" class="w-full rounded-xl bg-[#C3D809] px-4 py-3 font-extrabold text-[#111111] hover:bg-[#d4eb1a] transition-colors">Sign In</button>
        </form>
    </main>

    <script src="app.js"></script>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const error = document.getElementById('admin-login-error');
            error.classList.add('hidden');

            const response = await fetch('/api/auth/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({
                    username: document.getElementById('admin-username').value,
                    password: document.getElementById('admin-password').value
                })
            });
            const data = await response.json();
            if (!response.ok) {
                error.textContent = data.msg || 'Admin login failed.';
                error.classList.remove('hidden');
                return;
            }

            const profileResponse = await fetch('/api/auth/profile', {
                credentials: 'same-origin'
            });
            const profileData = await profileResponse.json();
            if (!profileResponse.ok || !profileData.user) {
                error.textContent = 'Admin session could not be verified. Please try again.';
                error.classList.remove('hidden');
                return;
            }
            Auth.saveUser(profileData.user);
            window.location.href = '/admin';
        });
    </script>
</body>
</html>
